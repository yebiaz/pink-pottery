name: Bid emails

on:
  schedule:
    # GitHub cron is in UTC. China time = UTC+8. (GitHub can run these up to ~30 min late.)
    # Off the top of the hour: GitHub delays or drops many runs scheduled at :00.
    - cron: "47 13 27-28 11 *"  # 21:47 China time Fri Nov 27 + Sat Nov 28 (usually arrives ~22:00): evening update
    - cron: "41 7 29 11 *"      # 15:41 China time Sun Nov 29 (usually ~16:00, 3 hours before close): last evening-style update
    # Monday winner emails are sent by hand from Outlook (Gmail lands in Junk), so no automatic Monday run.
  workflow_dispatch:            # lets you run it by hand from the Actions tab
    inputs:
      mode:
        description: "digest = evening update, winners = Monday results, sample = example email from made-up bids (needs a test address)"
        type: choice
        options: [digest, winners, sample]
        default: digest
      test_to:
        description: "TEST: send every email ONLY to this address (leave blank to send for real)"
        type: string
        default: ""
      style:
        description: "simple = plain-looking with a named link (default), plain = text only, fancy = pink design"
        type: choice
        options: [simple, plain, fancy]
        default: simple
      dry_run:
        description: "Dry run (print emails in the log, send nothing)"
        type: boolean
        default: false

jobs:
  send:
    # Scheduled (real) sends only happen when the repo variable SENDING_ON is set to yes.
    # Manual test runs always work.
    if: github.event_name != 'schedule' || vars.SENDING_ON == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Send emails
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USER:            ${{ secrets.SMTP_USER }}
          SMTP_PASS:            ${{ secrets.SMTP_PASS }}
          FROM_NAME:            ${{ vars.FROM_NAME }}
          SITE_URL:             ${{ vars.SITE_URL }}
          ORGANIZER_EMAIL:      ${{ vars.ORGANIZER_EMAIL }}
          PAYMENT_INFO:         ${{ vars.PAYMENT_INFO }}
          PICKUP_INFO:          ${{ vars.PICKUP_INFO }}
          TEST_TO:              ${{ inputs.test_to }}
          EMAIL_STYLE:          ${{ inputs.style || vars.EMAIL_STYLE || 'simple' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            [ "${{ inputs.dry_run }}" = "true" ] && FLAGS="--dry-run"
          elif [ "${{ github.event.schedule }}" = "41 0 30 11 *" ]; then
            MODE=winners
          else
            MODE=digest
          fi
          echo "Mode: $MODE $FLAGS"
          python scripts/send_emails.py "$MODE" $FLAGS
      - name: Keep winners.csv
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winners-csv
          path: winners.csv
          if-no-files-found: ignore
